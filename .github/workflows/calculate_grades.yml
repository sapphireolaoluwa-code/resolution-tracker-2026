name: Update Tracker Stats

on:
  push:
    paths:
      - 'README.md' # Only runs when you update the tracker

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: Allows the script to save changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Automation Script
        run: python automation.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add README.md
          git commit -m "🤖 Auto-updated Grade Average" || echo "No changes to commit"
          git push
